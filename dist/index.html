<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Domain for sale</title>
    <meta charset="utf-8">
    <meta name="description" content="Buy this domain name!">
    <meta name="author" content="Yair Even-Or">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="">

    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="grid place-items-center h-screen">
    <main class="w-fit flex flex-col gap-10">
      <header>
        <h1 class="text-5xl font-bold"></h1>
        <h2 class="text-1xl text-indigo-400">Hi, This domain is for sale</h2>
      </header>
      <form class="flex flex-col gap-3" action="https://formspree.io/f/mvodlvyy" method="POST">
        <input type="hidden" name="domain">
              <label class="block relative">
                <div class="flex absolute inset-y-0 left-0 items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                        </svg>
                </div>
                <input class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" type="email" name="email" placeholder="Your email">
              </label>
              <label class="block relative">
                <div class="flex absolute inset-y-0 left-0 items-center pl-3 pointer-events-none">
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                          <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"></path>
                          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd"></path>
                        </svg>
                </div>
                <input class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" type="number" name="number" placeholder="Your offer">
              </label>
        <button class="bg-slate-900 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-50 text-white font-semibold h-12 px-6 rounded-lg w-full flex items-center justify-center dark:bg-sky-500 dark:highlight-white/20 dark:hover:bg-sky-400" type="submit">Submit Offer</button>
      </form>
      <footer class="mt-10">Or contact me at&nbsp;<a class="mailto underline hover:no-underline hover:text-indigo-400" href="mailto:yair.even.or@gamil.com?subject=">Yair.Even.Or@gamil.com</a></footer>
    </main>
    <script>
      var domain = window.location.search.split('?d=')[1] || location.hostname.replace('www.',''), // location.search.split(/[=|&]/)[1],
      	h1 = document.querySelector('h1'),
      	mailto = document.querySelector('.mailto'),
      	hiddenInput = document.querySelector('input[type=hidden]');
      
      if( !domain )
      	document.body.innerHTML = '';
      
      document.title = domain;
      h1.innerHTML = domain;
      mailto.href += domain;
      hiddenInput.value = domain;
    </script>
  </body>
</html>
